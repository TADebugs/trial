<!DOCTYPE html>
<html>
  <head>
    <title>AR Planet Flashcards</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <script src="https://unpkg.com/aframe-gesture-handler@1.1.7/dist/aframe-gesture-handler.min.js"></script>
    <script src="https://unpkg.com/aframe-pinch-handler@1.0.0/dist/aframe-pinch-handler.min.js"></script>
    <link rel="icon" href="data:,">
    <style>
      #planet-selector {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(255,255,255,0.9);
        border-radius: 8px;
        padding: 10px 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-family: sans-serif;
      }
      #planet-info {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0,0,0,0.8);
        color: #fff;
        border-radius: 10px;
        padding: 18px 28px;
        min-width: 250px;
        max-width: 90vw;
        box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        font-family: sans-serif;
        font-size: 1.1em;
        text-align: center;
      }
      #planet-info h2 {
        margin: 0 0 8px 0;
        font-size: 1.3em;
      }
      #planet-info p {
        margin: 6px 0;
      }
    </style>
  </head>
  <body style="margin : 0px; overflow: hidden;">
    <div id="planet-selector">
      <label for="planetSelect"><b>Select Planet:</b></label>
      <select id="planetSelect">
        <option value="earth">Earth</option>
        <option value="mars">Mars</option>
        <option value="jupiter">Jupiter</option>
      </select>
      <button id="resetZoom" style="margin-left: 10px; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; background: #f0f0f0; cursor: pointer;">Reset Zoom</button>
      <div style="margin-top: 8px; font-size: 0.8em; color: #666;">
        <strong>Desktop Controls:</strong> Scroll to zoom • Click+drag to rotate • +/- keys to zoom • R to reset
      </div>
    </div>
    <div id="planet-info">
      <h2 id="planetName">Earth</h2>
      <p id="planetDesc">Our home planet, the third from the Sun and the only known world to support life.</p>
      <p id="planetFact"><i>Fun fact: 71% of Earth's surface is covered by water!</i></p>
      <p style="font-size:0.95em;opacity:0.7;margin-top:10px;">*Planet sizes are shown to scale for reference.</p>
    </div>
    <a-scene embedded arjs>
      <a-assets>
        <a-asset-item id="earthModel" src="planet_earth.glb"></a-asset-item>
        <a-asset-item id="marsModel" src="planet_mars.glb"></a-asset-item>
        <a-asset-item id="jupiterModel" src="realistic_jupiter.glb"></a-asset-item>
      </a-assets>
      <a-marker preset="hiro">
        <a-entity 
          id="earthEntity"
          gltf-model="#earthModel" 
          scale="1 1 1" 
          position="0 0 0"
          rotation="0 180 0"
          visible="true"
          animation="property: rotation; to: 0 540 0; loop: true; dur: 15000; easing: linear"
          gesture-handler="minScale: 0.5; maxScale: 3.0"
          pinch-handler>
        </a-entity>
        <a-entity 
          id="marsEntity"
          gltf-model="#marsModel" 
          scale="0.53 0.53 0.53" 
          position="0 0 0"
          rotation="0 180 0"
          visible="false"
          animation="property: rotation; to: 0 540 0; loop: true; dur: 12000; easing: linear"
          gesture-handler="minScale: 0.5; maxScale: 3.0"
          pinch-handler>
        </a-entity>
        <a-entity 
          id="jupiterEntity"
          gltf-model="#jupiterModel" 
          scale="0.005 0.005 0.005" 
          position="0 0 0"
          rotation="0 180 0"
          visible="false"
          animation="property: rotation; to: 0 540 0; loop: true; dur: 8000; easing: linear"
          gesture-handler="minScale: 0.5; maxScale: 3.0"
          pinch-handler>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      const planetData = {
        earth: {
          name: 'Earth',
          desc: 'Our home planet, the third from the Sun and the only known world to support life.',
          facts: [
            'Fun fact: 71% of Earth\'s surface is covered by water!',
            'Fun fact: Earth is the only planet known to have life!',
            'Fun fact: Earth\'s atmosphere is 78% nitrogen and 21% oxygen!',
            'Fun fact: Earth has one natural satellite - the Moon!',
            'Fun fact: Earth\'s magnetic field protects us from solar radiation!'
          ],
          model: '#earthModel',
          scale: '1 1 1',
        },
        mars: {
          name: 'Mars',
          desc: 'The fourth planet from the Sun, known as the Red Planet due to its reddish appearance.',
          facts: [
            'Fun fact: Mars has the tallest volcano in the solar system, Olympus Mons!',
            'Fun fact: A day on Mars is only 37 minutes longer than Earth!',
            'Fun fact: Mars has two moons: Phobos and Deimos!',
            'Fun fact: The red color comes from iron oxide (rust) on its surface!',
            'Fun fact: Mars has the largest canyon in the solar system, Valles Marineris!'
          ],
          model: '#marsModel',
          scale: '0.53 0.53 0.53',
        },
        jupiter: {
          name: 'Jupiter',
          desc: 'The largest planet in our solar system, a gas giant with a prominent Great Red Spot.',
          facts: [
            'Fun fact: Jupiter is so big that over 1,300 Earths could fit inside it!',
            'Fun fact: Jupiter has 79 known moons!',
            'Fun fact: The Great Red Spot is a storm that has been raging for over 300 years!',
            'Fun fact: Jupiter spins faster than any other planet - a day is only 10 hours!',
            'Fun fact: Jupiter\'s magnetic field is 14 times stronger than Earth\'s!'
          ],
          model: '#jupiterModel',
          scale: '0.005 0.005 0.005',
        },
      };
      const planetSelect = document.getElementById('planetSelect');
      const planetEntities = {
        earth: document.getElementById('earthEntity'),
        mars: document.getElementById('marsEntity'),
        jupiter: document.getElementById('jupiterEntity'),
      };
      const planetName = document.getElementById('planetName');
      const planetDesc = document.getElementById('planetDesc');
      const planetFact = document.getElementById('planetFact');
      
      // Fact rotation system
      let currentFactIndex = 0;
      let factRotationInterval;
      
      function startFactRotation(planetKey) {
        if (factRotationInterval) {
          clearInterval(factRotationInterval);
        }
        
        const facts = planetData[planetKey].facts;
        currentFactIndex = 0;
        
        factRotationInterval = setInterval(() => {
          currentFactIndex = (currentFactIndex + 1) % facts.length;
          planetFact.textContent = facts[currentFactIndex];
        }, 3000); // Change fact every 3 seconds
      }
      
      function stopFactRotation() {
        if (factRotationInterval) {
          clearInterval(factRotationInterval);
          factRotationInterval = null;
        }
      }
      
      planetSelect.addEventListener('change', (e) => {
        const selected = planetSelect.value;
        Object.keys(planetEntities).forEach(key => {
          planetEntities[key].setAttribute('visible', key === selected);
        });
        const data = planetData[selected];
        planetName.textContent = data.name;
        planetDesc.textContent = data.desc;
        planetFact.textContent = data.facts[0]; // Display the first fact initially
        
        // Start rotating facts for the selected planet
        startFactRotation(selected);
      });
      
      // Start fact rotation for Earth initially
      startFactRotation('earth');
      
      // Desktop controls (mouse and keyboard)
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;
      let currentPlanet = null;
      
      // Get the currently visible planet entity
      function getCurrentPlanetEntity() {
        const selected = planetSelect.value;
        return planetEntities[selected];
      }
      
      // Mouse wheel zoom
      document.addEventListener('wheel', (e) => {
        e.preventDefault();
        const entity = getCurrentPlanetEntity();
        if (!entity) return;
        
        const currentScale = entity.getAttribute('scale');
        const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1; // Scroll up = zoom in, down = zoom out
        
        let newScale = {
          x: currentScale.x * zoomFactor,
          y: currentScale.y * zoomFactor,
          z: currentScale.z * zoomFactor
        };
        
        // Limit scale between 0.5 and 3.0
        newScale.x = Math.max(0.5, Math.min(3.0, newScale.x));
        newScale.y = Math.max(0.5, Math.min(3.0, newScale.y));
        newScale.z = Math.max(0.5, Math.min(3.0, newScale.z));
        
        entity.setAttribute('scale', newScale);
      });
      
      // Mouse drag rotation
      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // Left mouse button only
          isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          currentPlanet = getCurrentPlanetEntity();
        }
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging || !currentPlanet) return;
        
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;
        
        const currentRotation = currentPlanet.getAttribute('rotation');
        const newRotation = {
          x: currentRotation.x + deltaY * 0.5, // Vertical mouse movement affects X rotation
          y: currentRotation.y + deltaX * 0.5, // Horizontal mouse movement affects Y rotation
          z: currentRotation.z
        };
        
        currentPlanet.setAttribute('rotation', newRotation);
        
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });
      
      document.addEventListener('mouseup', () => {
        isDragging = false;
        currentPlanet = null;
      });
      
      // Keyboard controls
      document.addEventListener('keydown', (e) => {
        const entity = getCurrentPlanetEntity();
        if (!entity) return;
        
        const currentScale = entity.getAttribute('scale');
        const currentRotation = entity.getAttribute('rotation');
        
        switch(e.key) {
          case '+':
          case '=':
            // Zoom in
            const zoomInScale = {
              x: Math.min(3.0, currentScale.x * 1.1),
              y: Math.min(3.0, currentScale.y * 1.1),
              z: Math.min(3.0, currentScale.z * 1.1)
            };
            entity.setAttribute('scale', zoomInScale);
            break;
          case '-':
            // Zoom out
            const zoomOutScale = {
              x: Math.max(0.5, currentScale.x * 0.9),
              y: Math.max(0.5, currentScale.y * 0.9),
              z: Math.max(0.5, currentScale.z * 0.9)
            };
            entity.setAttribute('scale', zoomOutScale);
            break;
          case 'r':
          case 'R':
            // Reset view
            const selected = planetSelect.value;
            const originalScale = planetData[selected].scale;
            entity.setAttribute('scale', originalScale);
            entity.setAttribute('position', '0 0 0');
            entity.setAttribute('rotation', '0 180 0');
            break;
        }
      });
      
      // Reset zoom functionality
      const resetZoomBtn = document.getElementById('resetZoom');
      resetZoomBtn.addEventListener('click', () => {
        const selected = planetSelect.value;
        const entity = planetEntities[selected];
        const originalScale = planetData[selected].scale;
        
        // Reset to original scale
        entity.setAttribute('scale', originalScale);
        
        // Reset position to center
        entity.setAttribute('position', '0 0 0');
        
        // Reset rotation to original
        entity.setAttribute('rotation', '0 180 0');
      });
    </script>
  </body>
</html>
